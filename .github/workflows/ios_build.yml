name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu Indir
        uses: actions/checkout@v4

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: iOS Klasorunu Olustur ve Kamera Izni Ekle
        run: |
          flutter create . --platforms=ios --org=com.ornek --project-name=urun_tarayici
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera izni'" ios/Runner/Info.plist || true

      - name: Bagimliliklari Yukle (Pub Get)
        run: flutter pub get

      - name: Podfile Olustur, Imzalamayi Kapat ve Podlari Yukle
        run: |
          # Xcode projesini ve Podfile'ı oluştur (derleme yapmaz, sadece hazırlar)
          flutter build ios --config-only --no-codesign

          cd ios
          
          # 1. Podfile'a imzalamayı kapatan ayarı ekle
          if [ -f Podfile ]; then
            echo "" >> Podfile
            echo "post_install do |installer|" >> Podfile
            echo "  installer.pods_project.targets.each do |target|" >> Podfile
            echo "    flutter_additional_ios_build_settings(target)" >> Podfile
            echo "    target.build_configurations.each do |config|" >> Podfile
            echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> Podfile
            echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> Podfile
            echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''" >> Podfile
            echo "    end" >> Podfile
            echo "  end" >> Podfile
            echo "end" >> Podfile
            # Podları yükle (post_install bloğunun çalışması için)
            pod install --repo-update
          fi

          # 2. Runner projesindeki tüm imza ayarlarını zorla sil
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM = /d' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj

          # 3. Pods projesindeki tüm imza ayarlarını zorla sil
          if [ -d "Pods" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Pods/Pods.xcodeproj/project.pbxproj
            sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Pods/Pods.xcodeproj/project.pbxproj
            sed -i '' '/DEVELOPMENT_TEAM = /d' Pods/Pods.xcodeproj/project.pbxproj
            sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Pods/Pods.xcodeproj/project.pbxproj
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Pods/Pods.xcodeproj/project.pbxproj
          fi

      - name: iOS Uygulamasini Derle (xcodebuild ile Imzasiz)
        run: |
          cd ios
          # Flutter'ın derleme adımını atlayıp doğrudan xcodebuild kullanıyoruz
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" build

      - name: Derlenen Dosyayi Sikistir
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Dosyayi GitHub'a Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-ios
          path: ios/build/Build/Products/Release-iphoneos/Runner.app.zip
