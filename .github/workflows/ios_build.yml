name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu Indir
        uses: actions/checkout@v4

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: iOS Klasorunu Olustur ve Kamera Izni Ekle
        run: |
          flutter create . --platforms=ios --org=com.ornek --project-name=urun_tarayici
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera izni'" ios/Runner/Info.plist || true

      - name: Bagimliliklari Yukle (Pub Get)
        run: flutter pub get

      - name: Podfile Olustur ve Imzalamayi Kapat
        run: |
          # Xcode projesini ve Podfile'ı oluştur
          flutter build ios --config-only --no-codesign

          cd ios
          
          # Podfile'a imzalamayı kapatan ayarı ekle
          if [ -f Podfile ]; then
            echo "" >> Podfile
            echo "post_install do |installer|" >> Podfile
            echo "  installer.pods_project.targets.each do |target|" >> Podfile
            echo "    flutter_additional_ios_build_settings(target)" >> Podfile
            echo "    target.build_configurations.each do |config|" >> Podfile
            echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> Podfile
            echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> Podfile
            echo "    end" >> Podfile
            echo "  end" >> Podfile
            echo "end" >> Podfile
          fi

          # Xcode proje dosyasında imzalamayı 'sed' ile zorla kapat (plutil yerine)
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj

      - name: iOS Uygulamasini Derle (Imzasiz)
        run: flutter build ios --release --no-codesign

      - name: Derlenen Dosyayi Sikistir
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Dosyayi GitHub'a Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-ios
          path: build/ios/iphoneos/Runner.app.zip
