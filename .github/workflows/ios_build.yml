name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Kodu İndir
      uses: actions/checkout@v4

    - name: Flutter Kur
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Eksik iOS Dosyalarını Oluştur
      run: flutter create . --platforms=ios

    - name: Bağımlılıkları Yükle
      run: flutter pub get

    - name: Podları Yükle
      run: |
        cd ios
        pod install
        cd ..

    - name: İmzalamayı Zorla Kapat
      run: sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj

    - name: iOS Uygulamasını Derle
      run: flutter build ios --release --no-codesign

    - name: Derlenen Dosyayı Sıkıştır
      run: |
        cd build/ios/iphoneos
        zip -r Runner.app.zip Runner.app

    - name: Dosyayı GitHub'a Yükle
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: build/ios/iphoneos/Runner.app.zip
