workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: iOS klasörünü oluştur
        script: |
          flutter create . --platforms=ios --org=com.ornek --project-name=urun_tarayici
      - name: Kamera iznini ekle
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Ürün barkodlarını taramak için kameraya erişim gerekiyor.'" ios/Runner/Info.plist || true
      - name: Bağımlılıkları yükle
        script: |
          flutter pub get
      - name: iOS uygulamasını derle (imzasız)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
