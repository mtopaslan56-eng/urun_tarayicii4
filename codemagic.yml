workflows:
  ios-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: iOS Klasörünü Oluştur ve Kamera İzni Ekle
        script: |
          flutter create . --platforms=ios --org=com.ornek --project-name=urun_tarayici
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera izni'" ios/Runner/Info.plist || true
      - name: Bağımlılıkları Yükle
        script: |
          flutter pub get
      - name: iOS Uygulamasını Derle (İmzasız)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
