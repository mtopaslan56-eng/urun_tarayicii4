workflows:
  ios-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: iOS Klasörünü Oluştur, İzinleri ve Minimum iOS Sürümünü Ayarla
        script: |
          flutter create . --platforms=ios --org=com.ornek --project-name=urun_tarayici
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Ürün barkodunu ve içindekiler etiketini okumak için kamera gerekir.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Galeriden ürün etiketi fotoğrafı seçmek için erişim gerekir.'" $PLIST || true
          sed -i '' -E "s/^#? ?platform :ios, '[0-9.]+'/platform :ios, '15.5'/" ios/Podfile
      - name: Bağımlılıkları Temizle ve Yeniden Yükle
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
          cd ..
      - name: iOS Uygulamasını Derle (xcodebuild ile İmzasız)
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" build
      - name: Derlenen Dosyayı Sıkıştır
        script: |
          cd ios/build/ios/Build/Products/Release-iphoneos
          zip -r Runner.app.zip Runner.app
    artifacts:
      - ios/build/ios/Build/Products/Release-iphoneos/Runner.app.zip
