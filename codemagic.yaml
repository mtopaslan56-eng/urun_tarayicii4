workflows:
  ios-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: iOS Klasörünü Oluştur ve Kamera İzni Ekle
        script: |
          flutter create . --platforms=ios --org=com.ornek --project-name=urun_tarayici
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Kamera izni'" ios/Runner/Info.plist || true
      - name: Bağımlılıkları Temizle ve Yeniden Yükle
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
          cd ..
      - name: iOS Uygulamasını Derle (xcodebuild ile İmzasız)
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" build
      - name: Derlenen Dosyayı Sıkıştır
        script: |
          cd ios/build/ios/Build/Products/Release-iphoneos
          zip -r Runner.app.zip Runner.app
    artifacts:
      - ios/build/ios/Build/Products/Release-iphoneos/Runner.app.zip
